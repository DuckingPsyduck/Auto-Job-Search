# Skill / domain vocabulary for the ATS keyword scorer.
# term: a case-insensitive regex. A posting 'uses' the term if the regex matches its text;
# the candidate 'has' it if the same regex matches their CV text. Score = overlap / posting terms.
# Edit freely: adding a term makes the score stricter, removing one makes it looser.
